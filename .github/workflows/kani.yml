name: Kani

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # required checks must also run on queued merges

env:
  CARGO_TERM_COLOR: always

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proofs:
    name: cargo kani (model checking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read} # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs Kani + CBMC and runs `cargo-kani` (the default
      # command), which checks every `#[kani::proof]` harness.
      # kani-version is pinned: a silently-changing verifier toolchain
      # could turn a real failure green or vice versa.
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"

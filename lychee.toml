# Placeholder URLs in config/doc examples — written to be illustrative,
# not resolvable.
exclude = [
    '^https?://(www|app[0-9]*)(:[0-9]+)?/?$',
    'host:port',
    'example\.com',
    '%E2%80%A6', # literal "…" used to truncate example URLs
    'api\.cloudflare\.com', # API base; anonymous GETs always 404
]

# llms-full.txt is generated by concatenating llms.txt and the book
# pages — every URL in it is already checked in those sources. Plaintext
# extraction also flags illustrative placeholders inside code spans
# (`http://…`, `http://host:port`), and unparsable URLs error out
# before `exclude` patterns apply, so they cannot be filtered.
exclude_path = ['llms-full\.txt$']

# Doc examples use loopback/private/link-local addresses.
exclude_all_private = true
